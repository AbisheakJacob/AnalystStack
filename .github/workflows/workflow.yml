name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded PR runs only; never cancel runs on release branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Format check
        run: uv run ruff format --check src/AnalystStack test
      - name: Lint
        run: uv run ruff check src/AnalystStack test
      - name: Type-check
        run: uv run mypy --ignore-missing-imports src/AnalystStack test

  test:
    name: Test (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run pytest
        run: uv run pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Determine next version, build, commit & tag
        id: version
        run: uv run semantic-release -v version
      - name: Publish GitHub release
        if: steps.version.outputs.released == 'true'
        run: uv run semantic-release publish
      - name: Upload distributions
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist/*
          if-no-files-found: error
    outputs:
      released: ${{ steps.version.outputs.released }}

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/AnalystStack/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true
